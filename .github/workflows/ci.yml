# 这个工作流将进行 Node.js 依赖的干净安装、缓存/恢复、构建源代码并在不同版本的 Node.js 上运行测试
# 更多信息请参见: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: React TypeScript CI/CD

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

# 允许并发工作流，但在同一分支上取消正在进行的运行
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 代码质量检查任务
  lint-and-format:
    name: 代码质量检查
    runs-on: ubuntu-latest
    
    steps:
    - name: 检出代码
      uses: actions/checkout@v4
      
    - name: 设置 Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
        
    - name: 安装依赖
      run: npm ci
      
    # TypeScript 类型检查
    - name: TypeScript 类型检查
      run: npx tsc --noEmit
      
    # ESLint 检查 (如果配置了的话)
    - name: ESLint 检查
      run: |
        if npx eslint --version 2>/dev/null; then
          npx eslint src --ext .ts,.tsx,.js,.jsx --max-warnings 0
        else
          echo "ESLint 未配置，跳过检查"
        fi
      continue-on-error: false

  # 构建和测试任务
  build-and-test:
    name: 构建和测试
    runs-on: ubuntu-latest
    needs: lint-and-format
    
    strategy:
      matrix:
        node-version: [18.x, 20.x]
        # 参见支持的 Node.js 发布计划: https://nodejs.org/en/about/releases/

    steps:
    - name: 检出代码
      uses: actions/checkout@v4
      
    - name: 设置 Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        
    - name: 安装依赖
      run: npm ci
      
    - name: 运行测试
      run: npm test -- --coverage --watchAll=false
      env:
        CI: true
        
    - name: 构建项目
      run: npm run build
      
    - name: 检查构建产物
      run: |
        if [ ! -d "build" ]; then
          echo "构建失败：build 目录不存在"
          exit 1
        fi
        echo "构建成功，产物大小:"
        du -sh build/
        
    # 上传测试覆盖率报告 (可选)
    - name: 上传覆盖率报告到 Codecov
      if: matrix.node-version == '20.x'
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage/lcov.info
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  # 安全性检查任务
  security-audit:
    name: 安全性检查
    runs-on: ubuntu-latest
    needs: lint-and-format
    
    steps:
    - name: 检出代码
      uses: actions/checkout@v4
      
    - name: 设置 Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
        
    - name: 安装依赖
      run: npm ci
      
    - name: 运行安全审计
      run: npm audit --audit-level=moderate
      
    - name: 检查过时依赖
      run: npm outdated || true

  # 部署到预发布环境 (仅在主分支推送时)
  deploy-staging:
    name: 部署到预发布环境
    runs-on: ubuntu-latest
    needs: [build-and-test, security-audit]
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    
    steps:
    - name: 检出代码
      uses: actions/checkout@v4
      
    - name: 设置 Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
        
    - name: 安装依赖
      run: npm ci
      
    - name: 构建生产版本
      run: npm run build
      env:
        NODE_ENV: production
        
    # 这里可以添加部署到预发布环境的步骤
    - name: 部署到预发布环境
      run: |
        echo "部署到预发布环境..."
        # 在这里添加您的部署命令
        # 例如: rsync, scp, 或者云服务提供商的 CLI 工具
        
  # 部署到生产环境 (仅在主分支推送时)
  deploy-production:
    name: 部署到生产环境
    runs-on: ubuntu-latest
    needs: [build-and-test, security-audit]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    
    steps:
    - name: 检出代码
      uses: actions/checkout@v4
      
    - name: 设置 Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
        
    - name: 安装依赖
      run: npm ci
      
    - name: 构建生产版本
      run: npm run build
      env:
        NODE_ENV: production
        
    # 这里可以添加部署到生产环境的步骤
    - name: 部署到生产环境
      run: |
        echo "部署到生产环境..."
        # 在这里添加您的生产环境部署命令
        # 例如: AWS S3, Netlify, Vercel 等
        
    - name: 通知部署成功
      run: |
        echo "🚀 生产环境部署成功!"
        echo "构建时间: $(date)"
        echo "提交: ${{ github.sha }}" 